<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./first.css">
    <title>Document</title>
    
</head>
<body>
    <h1 id="mood"> MY MOOD TODAY</h1>
    <div id="moodDisplay">
        
        <button id="happy" > Happy</button>
        <button id="sad" > Sad</button>
        <button id="excited"> Excited</button>
        <button id="angry"> Angry</button>
 
    </div>
    <div>
        <button id="themeToggle">🌙 Dark Mode</button>
    </div>


    <div id="messageBox">
        <h2 id="messageTitle">Your Daily Motivation ✨</h2>
        <p id="moodMessage">Select your mood to get a motivational message!</p>
    </div>

    <script src="first.js"></script>
    
</body>
</html>
